<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nein3D Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">N3</div>
        <div>
          <strong>Nein3D Studio</strong>
          <span>web DCC workspace</span>
        </div>
      </div>
      <nav class="menu" aria-label="Главное меню">
        <button data-menu="file">Файл</button>
        <button data-menu="edit">Правка</button>
        <button data-menu="create">Создать</button>
        <button data-menu="motion">Анимация</button>
        <button data-menu="render">Рендер</button>
        <button data-menu="export">Экспорт</button>
      </nav>
      <div class="top-actions">
        <button id="saveProjectTop" class="tool-button" title="Сохранить проект">S</button>
        <button id="openEngine" class="tool-button wide" title="Открыть текущий движок">Engine</button>
      </div>
    </header>

    <section class="main-toolbar" aria-label="Инструменты">
      <button class="tool-button active" data-tool="select" title="Select">↖</button>
      <button class="tool-button" data-tool="move" title="Move">↕</button>
      <button class="tool-button" data-tool="rotate" title="Rotate">⟳</button>
      <button class="tool-button" data-tool="scale" title="Scale">□</button>
      <span class="toolbar-separator"></span>
      <button class="tool-button" id="undoAction" title="Undo">↶</button>
      <button class="tool-button" id="redoAction" title="Redo">↷</button>
      <span class="toolbar-separator"></span>
      <button class="tool-button accent" id="generateMotion" title="Generate">▶</button>
      <button class="tool-button" id="playTimeline" title="Play / Pause">▸</button>
      <button class="tool-button" id="stopTimeline" title="Stop">■</button>
      <span class="toolbar-separator"></span>
      <label class="compact-field">
        <span>FPS</span>
        <input id="fpsInput" type="number" min="1" max="120" value="30">
      </label>
      <label class="compact-field">
        <span>Frames</span>
        <input id="frameCountInput" type="number" min="30" max="900" value="180">
      </label>
    </section>

    <main class="workspace">
      <aside class="left-tools" aria-label="Быстрые инструменты">
        <button class="tool-button active" data-left-tool="rig" title="Rig">◎</button>
        <button class="tool-button" data-left-tool="path" title="Path">⌁</button>
        <button class="tool-button" data-left-tool="pose" title="Pose">◇</button>
        <button class="tool-button" data-left-tool="usd" title="USD">▣</button>
        <button class="tool-button" data-left-tool="camera" title="Camera">▱</button>
      </aside>

      <section class="viewport-column">
        <div class="viewport-tabs">
          <button class="active">Perspective</button>
          <button>Top</button>
          <button>Front</button>
          <button>Left</button>
          <div class="viewport-meta">
            <span id="activeToolLabel">Select</span>
            <span>Shaded</span>
            <span>Grid</span>
          </div>
        </div>
        <div class="viewport" id="viewport">
          <canvas id="viewportCanvas" width="1280" height="720"></canvas>
          <div class="viewport-overlay top-left">
            <strong>Viewport</strong>
            <span id="viewportStatus">Prompt editable · local project</span>
          </div>
          <div class="viewport-overlay bottom-right">
            <span id="frameReadout">Frame 0 / 179</span>
          </div>
          <div class="transform-gizmo" aria-hidden="true">
            <span class="axis x"></span>
            <span class="axis y"></span>
            <span class="axis z"></span>
          </div>
        </div>
      </section>

      <aside class="command-panel">
        <div class="panel-tabs" role="tablist">
          <button class="active" data-panel="create">Create</button>
          <button data-panel="modify">Modify</button>
          <button data-panel="motion">Motion</button>
          <button data-panel="assets">Assets</button>
          <button data-panel="export">Export</button>
        </div>

        <section class="panel-section">
          <h2>Text To Motion</h2>
          <label class="field">
            <span>Prompt</span>
            <textarea id="promptInput" rows="5" spellcheck="true">A person walks forward.</textarea>
          </label>
          <div class="button-row">
            <button id="applyPrompt" class="primary-button">Apply To Track</button>
            <button id="addPromptBlock">Add Block</button>
          </div>
        </section>

        <section class="panel-section two-col">
          <label class="field">
            <span>Model</span>
            <select id="modelSelect">
              <option value="kimodo-soma-seed">SOMA SEED</option>
              <option value="kimodo-soma-rp">SOMA RP</option>
              <option value="kimodo-g1-seed">G1 SEED</option>
            </select>
          </label>
          <label class="field">
            <span>Seed</span>
            <input id="seedInput" type="number" value="42">
          </label>
          <label class="field">
            <span>Variants</span>
            <input id="variantsInput" type="number" min="1" max="10" value="1">
          </label>
          <label class="field">
            <span>Steps</span>
            <input id="stepsInput" type="number" min="2" max="1000" value="100">
          </label>
        </section>

        <section class="panel-section">
          <h2>Scene</h2>
          <div class="object-list" id="objectList"></div>
          <div class="button-row">
            <button id="addRig">Add Rig</button>
            <button id="clearScene" class="danger-button">Clear</button>
          </div>
        </section>

        <section class="panel-section">
          <h2>USD / Assets</h2>
          <label class="field">
            <span>USD Path</span>
            <input id="usdPathInput" type="text" value="asset.usd">
          </label>
          <div class="button-row">
            <button id="loadUsd">Load USD</button>
            <button id="clearUsd">Clear USD</button>
          </div>
        </section>
      </aside>
    </main>

    <section class="timeline-panel">
      <div class="timeline-header">
        <div class="transport">
          <button id="prevFrame">|‹</button>
          <button id="playTimelineBottom">▶</button>
          <button id="nextFrame">›|</button>
        </div>
        <div class="timeline-title">
          <strong>Timeline</strong>
          <span id="timelineSummary">1 prompt block · 6.0 sec</span>
        </div>
        <input id="frameSlider" type="range" min="0" max="179" value="0">
      </div>
      <div class="timeline-grid" id="timelineGrid">
        <div class="track-labels">
          <span>Prompts</span>
          <span>Root Path</span>
          <span>Pose Keys</span>
        </div>
        <div class="tracks">
          <div class="ruler" id="timelineRuler"></div>
          <div class="track prompt-track" id="promptTrack"></div>
          <div class="track path-track" id="pathTrack"></div>
          <div class="track key-track" id="keyTrack"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </section>

    <footer class="statusbar">
      <span id="engineStatus">Engine: checking</span>
      <span id="memoryStatus">VRAM: local cleanup enabled</span>
      <span id="projectStatus">Project: unsaved</span>
    </footer>
  </div>

  <dialog id="messageDialog">
    <form method="dialog">
      <h2 id="dialogTitle">Nein3D</h2>
      <p id="dialogBody"></p>
      <button class="primary-button">OK</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
